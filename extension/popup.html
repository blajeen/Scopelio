<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scopelio — Color Highlights & Donut Analytics</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="identity.css"><script src="shared.js" defer></script><script src="i18n.js" defer></script><script src="popup.js" defer></script></head>
<body><div class="app">
<header class="topbar"><a class="brand" href="#" data-i18n-label="home"><img class="brand-icon" src="icons/48.png" width="32" height="32" alt=""><span>scopelio<span class="brand-dot">.</span></span></a><div class="header-actions"><button id="settings-button" class="icon-button" data-i18n-label="preferences" data-i18n-title="preferences">⚙</button><label class="switch" data-i18n-title="enable"><input id="enabled" type="checkbox" data-i18n-label="enable"><span></span></label></div></header>
<main><div class="intro"><span class="eyebrow" data-i18n="eyebrow">A FRESH PERSPECTIVE ON TEXT</span><h1 data-i18n="headline">Find what matters.</h1><p data-i18n="tagline">Your words. Your colors. More clarity.</p></div>
<section class="glass analytics" aria-labelledby="analytics-title"><div class="section-heading"><h2 id="analytics-title" data-i18n="page">On this page</h2><span id="page-host" class="site-tag" data-i18n="connecting">Connecting…</span></div><div class="chart-area"><svg id="donut" viewBox="0 0 200 200" role="img" data-i18n-label="none"><circle class="orbit-ruler" cx="100" cy="100" r="96"/><circle class="orbit-guide" cx="100" cy="100" r="58"/><circle class="donut-track" cx="100" cy="100" r="78"/><g id="segments" transform="rotate(-90 100 100)"></g></svg><div class="chart-center"><strong id="total">0</strong><span data-i18n="occurrences">occurrences</span></div><span class="chart-spark spark-one"></span><span class="chart-spark spark-two"></span></div><p id="chart-caption" class="chart-caption" data-i18n="emptyChart"></p><div id="legend" class="legend"></div><p class="chart-note" data-i18n="proportion"></p></section>
<section class="floating-controls glass"><div class="floating-heading"><div><span class="orbit-symbol" aria-hidden="true">◌</span><div><label for="floating-enabled" data-i18n="floating">Scopelio Orbit</label><p data-i18n="floatingHelp"></p></div></div><label class="switch"><input id="floating-enabled" type="checkbox" data-i18n-label="floatingToggle"><span></span></label></div><div id="floating-options" hidden><label for="floating-opacity" data-i18n="opacity">Opacity</label><input id="floating-opacity" type="range" min="20" max="100" step="1" data-i18n-label="opacity"><output id="opacity-value" for="floating-opacity">78%</output></div></section><div class="filters-heading"><div><h2><span data-i18n="yourFilters">Your filters</span> <span id="filter-count" class="count-badge">0</span></h2><p data-i18n="organize"></p></div><button id="add-filter" class="add-button"><span aria-hidden="true">+</span> <span data-i18n="newFilter">New filter</span></button></div>
<section id="filters" class="filters" aria-label="Word filters"></section><div id="empty-state" class="empty-state glass"><span class="empty-glyph" aria-hidden="true">Aa<span>✦</span></span><h3 data-i18n="emptyTitle"></h3><p data-i18n-html="emptyText"></p><button id="examples" class="text-button"><span data-i18n="examples">Try example filters</span> <span aria-hidden="true">↗</span></button></div>
<div id="navigator" class="navigator glass" hidden><span id="navigation-label" data-i18n="all"></span><div><button id="previous" class="icon-button" data-i18n-label="previous">↑</button><span id="position">—</span><button id="next" class="icon-button" data-i18n-label="next">↓</button></div></div>
<section class="site-controls glass"><div><span class="site-icon" aria-hidden="true">◎</span><div><label for="auto-site" data-i18n="auto">Always on this site</label><p id="site-help" data-i18n="autoHelp"></p></div></div><label class="switch"><input id="auto-site" type="checkbox" data-i18n-label="auto"><span></span></label></section><p id="status" class="status" role="status" aria-live="polite"></p><button id="rescan" class="rescan">↻ <span data-i18n="rescan">Analyze page again</span></button></main>
<footer><span><span class="privacy-dot"></span><span data-i18n="privacy"></span></span><span class="version">v0.2.0</span></footer></div>
<dialog id="filter-dialog" aria-labelledby="dialog-title"><form id="filter-form"><div class="dialog-header"><div><span class="eyebrow" data-i18n="editorEyebrow"></span><h2 id="dialog-title" data-i18n="newFilter"></h2></div><button type="button" class="icon-button" id="close-dialog" data-i18n-label="close">×</button></div><label class="field"><span data-i18n="name">Name</span><input id="filter-name" maxlength="60" required data-i18n-placeholder="namePlaceholder" autocomplete="off"></label><label class="field"><span data-i18n="terms">Terms</span><textarea id="filter-terms" data-i18n-label="terms" rows="3" required placeholder="React, Vue, Angular"></textarea><span class="field-hint" data-i18n="termsHint"></span></label><fieldset class="color-field"><legend data-i18n="color"></legend><div id="palette"></div><label class="custom-color" data-i18n-title="customColor"><input type="color" id="filter-color" value="#8b7cf8" data-i18n-label="customColor"><span data-i18n="customize"></span></label></fieldset><div class="match-options"><label><input id="whole-word" type="checkbox" checked><span data-i18n="whole"></span></label><label><input id="case-sensitive" type="checkbox"><span data-i18n="case"></span></label><label><input id="ignore-accents" type="checkbox" checked><span data-i18n="accents"></span></label></div><p id="form-error" class="form-error" role="alert"></p><div class="dialog-actions"><button id="delete-filter" type="button" class="danger-button" hidden data-i18n="delete"></button><button type="submit" class="primary-button"><span data-i18n="save">Save filter</span> <span aria-hidden="true">↗</span></button></div></form></dialog>
<dialog id="preferences" aria-labelledby="preferences-title"><div class="dialog-header"><h2 id="preferences-title" data-i18n="yourWay"></h2><button id="close-preferences" class="icon-button" data-i18n-label="close">×</button></div><label class="field"><span data-i18n="language">Language</span><select id="language" data-i18n-label="language"><option value="en">English</option><option value="pt-BR">Português (Brasil)</option></select></label><label class="field"><span data-i18n="appearance">Appearance</span><select id="theme" data-i18n-label="appearance"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></label><label class="preference-check"><input type="checkbox" id="reduce-transparency"><span data-i18n="transparency"></span></label><div class="privacy-copy"><h3 data-i18n="privacyTitle"></h3><p data-i18n="privacyText"></p><p data-i18n="overlap"></p><p data-i18n="scope"></p></div></dialog>
</body></html>
